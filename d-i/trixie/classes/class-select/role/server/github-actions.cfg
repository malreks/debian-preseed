# Authored complete role class. Common OS packages belong to fragments/apt.cfg.
d-i pkgsel/include string crowdsec openssh-server openssh-sftp-server python3-venv docker-cli podman crun uidmap slirp4netns fuse-overlayfs containernetworking-plugins passt gzip libicu76 libssl3t64 libkrb5-3 libzstd1 liblttng-ust1t64
d-i pkgsel/include seen true
d-i apt-setup/local0/repository string https://packagecloud.io/crowdsec/crowdsec/any any main
d-i apt-setup/local0/key string https://packagecloud.io/crowdsec/crowdsec/gpgkey
d-i apt-setup/local0/comment string crowdsec-stable
d-i apt-setup/local0/source boolean false

# Keep central enrollment pending; the local API is installed on every role.
crowdsec crowdsec/lapi boolean true
crowdsec crowdsec/lapi seen true
crowdsec crowdsec/capi boolean false
crowdsec crowdsec/capi seen true
