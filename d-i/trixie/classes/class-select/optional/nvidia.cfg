# Current NVIDIA open kernel modules and Wayland/compute userspace. The
# installer rejects Quadro P520 (Pascal/SM 6.1) for this class. Use
# optional/nvidia-legacy for that adapter, which selects Pika's proprietary
# 580 branch and CUDA 12.x.
#
# This is an explicit 620.70.10 split-package set. It deliberately avoids
# nvidia-driver, nvidia-driver-cuda, nvidia-driver-libs, the X.Org driver,
# GLX/Vulkan branches, and persistence or power-daemon packages. The exact
# NVIDIA package versions are selected by optional/nvidia.pref.
d-i pkgsel/include string firmware-misc-nonfree firmware-nvidia-gsp libvulkan1 dkms g++ nvidia-kernel-open-dkms nvidia-kernel-support nvidia-modprobe nvidia-smi nvidia-egl-icd libegl-nvidia0 libgles-nvidia1 libgles-nvidia2 libnvidia-allocator1 libnvidia-cfg1 libnvidia-eglcore libnvidia-glvkspirv libnvidia-gpucomp libnvidia-ml1 libcuda1 libnvidia-ptxjitcompiler1 libnvidia-pkcs11-openssl3 libnvcuvid1 libnvidia-egl-gbm1 libnvidia-egl-wayland21 nvidia-vaapi-driver libgl1 libegl1 libgles2 libelf-dev clang lld llvm

# NVIDIA's signed Debian 13 channel is also the source of the CUDA 13 toolkit.
d-i apt-setup/local0/repository string https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/ /
d-i apt-setup/local0/options string arch=amd64
d-i apt-setup/local0/key string https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/8793F200.pub
d-i apt-setup/local0/comment string nvidia-debian13-amd64
d-i apt-setup/local0/source boolean false

# Disabled Ubuntu-based fallback; desktop roles use Debian-based Pika instead.
# System76's signed noble release supplies the EGLWayland 1 compatibility ABI.
# NVIDIA preferences exclude every package from this disabled fallback.
# d-i apt-setup/local1/repository string https://apt.pop-os.org/release noble main
# d-i apt-setup/local1/options string arch=amd64
# d-i apt-setup/local1/key string https://raw.githubusercontent.com/pop-os/keyring/master/usr/share/keyrings/pop-archive-keyring.gpg
# d-i apt-setup/local1/comment string system76-egl-wayland-noble
# d-i apt-setup/local1/source boolean false
