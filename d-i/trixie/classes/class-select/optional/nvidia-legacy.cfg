# Opt-in Pascal-capable NVIDIA Wayland baseline. This class is selected only
# when optional/nvidia-legacy is requested and an NVIDIA adapter is detected.
# The CUDA toolkit remains owned by optional/cuda-legacy.
#
# This is an explicit split-package set. It contains no NVIDIA driver meta
# package, X.Org NVIDIA driver, GLX driver library, Vulkan ICD, settings
# utility, persistence daemon, or power daemon. The Pika DKMS package has
# hard dependencies on its exact kernel source/support/common, alternative
# registration, and GSP firmware packages. Those packages are included so
# dpkg can configure the proprietary kernel module. Pascal still reports GSP
# as N/A at runtime because the GPU does not use that firmware path.
#
# EGL's package dependency closure includes X11 client libraries on Pika's
# current build. The policy excludes X.Org servers and drivers while retaining
# those required shared-library dependencies for the Wayland EGL loader.
# Keep the GLVND/Mesa runtime closure explicit. Pika's 580 EGL package requires
# libgbm1 >= 26.2.5, while libglx-mesa0 and the Mesa Gallium packages require
# one exact Mesa build. The preference file pins this complete runtime set.
d-i pkgsel/include string nvidia-alternative-580 nvidia-support-580 firmware-nvidia-gsp-580 nvidia-kernel-dkms-580 nvidia-kernel-source-580 nvidia-kernel-support-580 nvidia-kernel-common-580 nvidia-modprobe-580 nvidia-smi-580 nvidia-suspend-common-580 nvidia-egl-common-580 nvidia-egl-icd-580 libegl-nvidia0-580 libgles-nvidia1-580 libgles-nvidia2-580 libnvidia-allocator1-580 libnvidia-eglcore-580 libnvidia-glvkspirv-580 libnvidia-gpucomp-580 libnvidia-ml1-580 libnvcuvid1-580 libcuda1-580 libnvidia-ptxjitcompiler1-580 libnvidia-pkcs11-openssl3-580 libnvidia-egl-wayland1 libnvidia-egl-gbm1 libgbm1 libgl1-mesa-dri libegl-mesa0 libglx-mesa0 mesa-libgallium libmesa-stable nvidia-vaapi-driver libgl1 libegl1 libgles2 libelf-dev clang lld llvm
d-i pkgsel/include seen true

# Use one signed Debian-based archive for the complete proprietary 580 family.
# This identical desktop-role declaration coalesces to one apt-setup source;
# an opted-in server receives it here as well. XanMod remains the kernel source.
d-i apt-setup/local0/repository string https://ppa.pika-os.com/ pika cockatiel
d-i apt-setup/local0/options string arch=amd64
d-i apt-setup/local0/key string https://raw.githubusercontent.com/PikaOS-Linux/pika-base-debian-container/main/pika-keyring.gpg.key
d-i apt-setup/local0/comment string pikaos
d-i apt-setup/local0/source boolean false

# Disabled Ubuntu-based fallback; Pika supplies this class instead.
# System76's signed noble release supplies the EGLWayland 1 compatibility ABI.
# NVIDIA preferences exclude every package from this disabled fallback.
# d-i apt-setup/local0/repository string https://apt.pop-os.org/release noble main
# d-i apt-setup/local0/options string arch=amd64
# d-i apt-setup/local0/key string https://raw.githubusercontent.com/pop-os/keyring/master/usr/share/keyrings/pop-archive-keyring.gpg
# d-i apt-setup/local0/comment string system76-egl-wayland-noble
# d-i apt-setup/local0/source boolean false
