##########  Mirror / APT defaults  ##########
d-i debian-installer/allow_unauthenticated boolean false
d-i debian-installer/allow_unauthenticated_ssl boolean false
d-i mirror/country string manual
d-i mirror/protocol select https
d-i mirror/codename string forky
d-i mirror/suite string forky
d-i mirror/udeb/suite string forky
#d-i mirror/http/hostname string deb.debian.org
#d-i mirror/http/directory string /debian/
#d-i mirror/http/proxy string
d-i mirror/https/countries select manual
#d-i mirror/https/hostname string deb.debian.org
#d-i mirror/https/mirror select deb.debian.org
#d-i mirror/https/directory string /debian/
d-i mirror/https/hostname string mirrors.glesys.net
d-i mirror/https/mirror select mirrors.glesys.net
d-i mirror/https/directory string /debian/
d-i mirror/https/proxy string
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/no_mirror boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/security_path string /debian-security
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/backports boolean false

##########  Inofficial APT Archives  ##########
# Debian Sid (Unstable)
d-i apt-setup/local0/repository string https://mirrors.glesys.net/debian sid main contrib non-free non-free-firmware
d-i apt-setup/local0/options string arch=amd64
d-i apt-setup/local0/comment string Debian Sid (Unstable)
d-i apt-setup/local0/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local0/source boolean true

# Debian XanMod Kernel
d-i apt-setup/local2/repository string https://deb.xanmod.org forky main non-free
d-i apt-setup/local2/options string arch=amd64
d-i apt-setup/local2/comment string XanMod kernel archive
d-i apt-setup/local2/key string https://dl.xanmod.org/archive.key
d-i apt-setup/local2/source boolean false

# OBS home:cramerz:debian Debian_Unstable
d-i apt-setup/local3/repository string https://downloadcontent.opensuse.org/repositories/home:/cramerz:/debian/Debian_Unstable/ /
d-i apt-setup/local3/options string arch=amd64
d-i apt-setup/local3/comment string OBS home:cramerz:debian Debian_Unstable
d-i apt-setup/local3/key string https://downloadcontent.opensuse.org/repositories/home:cramerz:debian/Debian_Unstable/Release.key
d-i apt-setup/local3/source boolean false

# Debian Trixie compatibility archive. Forky does not carry
# apparmor-profiles-extra, so the package-qualified pkgsel request below must
# have a signed Trixie Release available during target package installation.
d-i apt-setup/local19/repository string https://mirrors.glesys.net/debian trixie main contrib non-free non-free-firmware
d-i apt-setup/local19/options string arch=amd64
d-i apt-setup/local19/comment string Debian Trixie compatibility archive
d-i apt-setup/local19/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local19/source boolean true

# Debian Experimental
# Satty 0.21.1's upstream binary needs GLIBC_2.43, and the selected DevOps role
# explicitly installs the LLVM 24 toolchain from this signed archive. The
# default pin keeps unrequested Experimental packages out of normal upgrades.
d-i apt-setup/local20/repository string https://mirrors.glesys.net/debian experimental main contrib non-free non-free-firmware
d-i apt-setup/local20/options string arch=amd64
d-i apt-setup/local20/comment string Debian Experimental (explicit LLVM 24 and private Satty runtime)
d-i apt-setup/local20/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local20/source boolean true

# Zabbly Incus Stable (Debian Trixie). Forky has no native Incus UI build;
# keep the daemon, client, base files, and Web UI on one signed Zabbly source.
d-i apt-setup/local21/repository string https://pkgs.zabbly.com/incus/stable trixie main
d-i apt-setup/local21/options string arch=amd64
d-i apt-setup/local21/key string https://pkgs.zabbly.com/key.asc
d-i apt-setup/local21/comment string zabbly-incus-stable-debian-trixie
d-i apt-setup/local21/source boolean false

# Debian rc-buggy archive. Keep it indexed for explicit diagnostics while the
# suite preference drop-in blocks accidental package selection.
d-i apt-setup/local22/repository string https://mirrors.glesys.net/debian rc-buggy main contrib non-free non-free-firmware
d-i apt-setup/local22/options string arch=amd64
d-i apt-setup/local22/comment string Debian rc-buggy (explicit opt-in only)
d-i apt-setup/local22/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local22/source boolean true

# Debian Trixie Backports is kept available as the cross-suite fallback used by
# explicitly reviewed packages on a Forky target.
d-i apt-setup/local27/repository string https://mirrors.glesys.net/debian trixie-backports main contrib non-free non-free-firmware
d-i apt-setup/local27/options string arch=amd64
d-i apt-setup/local27/comment string Debian Trixie Backports (explicit opt-in only)
d-i apt-setup/local27/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local27/source boolean true

# Debian Forky Backports. Keep the native backports archive available to every
# role; the suite preference drop-in blocks unrequested backports packages.
d-i apt-setup/local28/repository string https://mirrors.glesys.net/debian forky-backports main contrib non-free non-free-firmware
d-i apt-setup/local28/options string arch=amd64
d-i apt-setup/local28/comment string Debian Forky Backports (explicit opt-in only)
d-i apt-setup/local28/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local28/source boolean true

# Debian Forky (Testing) is the primary mirror selected above. Keep the
# duplicate local stanza disabled so apt-setup writes one authoritative suite
# source and cannot create a second candidate path.
#d-i apt-setup/local4/repository string https://deb.debian.org/debian forky main contrib non-free non-free-firmware
#d-i apt-setup/local4/comment string Debian Forky (Testing)
#d-i apt-setup/local4/key string https://ftp-master.debian.org/keys/archive-key-13.asc
#d-i apt-setup/local4/source boolean true

##########  Package selection defaults  ##########
d-i base-installer/install-recommends boolean false
d-i base-installer/install-recommends seen true
d-i base-installer/excludes string dbus dbus-daemon dbus-x11 x11-xkb-utils xserver-xorg xserver-xorg-core xserver-xorg-video-amdgpu xwayland
popularity-contest popularity-contest/participate boolean false
d-i base-installer/includes string initramfs-tools busybox mokutil openssl shim-signed cryptsetup kmod gzip zstd gpg
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/run_tasksel seen true
d-i pkgsel/install-recommends boolean false
d-i pkgsel/install-recommends seen true
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select unattended-upgrades
# Common security baseline for every role; desktop notifications stay in desktop classes.
# Keep curl and its exact library dependency on the selected suite.
# LLVM snapshot selection uses a source pin without recursive /experimental requests.
d-i pkgsel/include string btrfs-progs xfsprogs bolt dosfstools lz4 inotify-tools sudo ca-certificates bash-completion perl liblog-any-perl libmoo-perl libmoox-handlesvia-perl libmoox-log-any-perl libmoox-options-perl libmoox-strictconstructor-perl libmoox-types-mooselike-perl libmoox-types-mooselike-numeric-perl libmoox-typetiny-perl libtype-tiny-perl libtypes-path-tiny-perl gpg gnupg git wget curl/forky libcurl4t64/forky unzip tar 7zip cryptsetup efibootmgr initramfs-tools busybox mokutil sbsigntool openssl kmod util-linux util-linux-extra usrmerge ifupdown network-manager wpasupplicant wireless-regdb ethtool xz-utils zstd nftables fail2ban rsyslog debsums logrotate fonts-dejavu-core python3 python3-yaml dbus-broker dbus-user-session dbus-bin dbus-system-bus-common dbus-session-bus-common udisks2 polkitd unattended-upgrades tpm2-tools tpm-udev firmware-linux-free firmware-linux-nonfree firmware-misc-nonfree firmware-realtek firmware-iwlwifi firmware-atheros firmware-brcm80211 firmware-sof-signed whois libhttp-tiny-perl libio-socket-ssl-perl libarchive-zip-perl libxml-libxml-perl python3-defusedxml procps psmisc acl cryptsetup-initramfs systemd-cryptsetup systemd-tpm oathtool e2fsprogs power-profiles-daemon python3-dbus python3-gi libglib2.0-bin gir1.2-glib-2.0 pkexec apparmor apparmor-profiles apparmor-profiles-extra/trixie apparmor-utils audispd-plugins auditd python3-pyinotify systemd-coredump systemd-timesyncd apparmor-notify
d-i hw-detect/load_firmware boolean true
d-i hw-detect/load_firmware seen true
