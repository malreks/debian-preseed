# Current NVIDIA open kernel modules and Wayland/compute userspace.
# Component packages avoid the nvidia-open/nvidia-driver X.Org metapackages.
d-i pkgsel/include string firmware-misc-nonfree libvulkan1 nvidia-kernel-open-dkms nvidia-driver-cuda nvidia-egl-icd libegl-nvidia0 libgles-nvidia1 libgles-nvidia2 libglx-nvidia0 libnvidia-allocator1 libnvidia-egl-gbm1 libnvidia-egl-wayland21 nvidia-vaapi-driver libgl1 libegl1 libgles2 libelf-dev clang lld llvm

# NVIDIA's signed Debian 13 channel is also the source of the CUDA 13 toolkit.
d-i apt-setup/local0/repository string https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/ /
d-i apt-setup/local0/key string https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/8793F200.pub
d-i apt-setup/local0/comment string nvidia-debian13-amd64
d-i apt-setup/local0/source boolean false
