d-i pkgsel/include seen true
d-i apt-setup/local0/repository string https://packagecloud.io/crowdsec/crowdsec/any any main
d-i apt-setup/local0/key string https://packagecloud.io/crowdsec/crowdsec/gpgkey
d-i apt-setup/local0/comment string crowdsec-stable
d-i apt-setup/local0/source boolean false
# Keep central enrollment pending; the local API is installed on every role.
crowdsec crowdsec/lapi boolean true
crowdsec crowdsec/lapi seen true
crowdsec crowdsec/capi boolean false
crowdsec crowdsec/capi seen true

# mise-upstream
d-i apt-setup/local2/repository string https://mise.jdx.dev/deb stable main
d-i apt-setup/local2/key string https://mise.jdx.dev/gpg-key.pub
d-i apt-setup/local2/comment string mise-upstream
d-i apt-setup/local2/source boolean false

# cloudflared-upstream
d-i apt-setup/local3/repository string https://pkg.cloudflare.com/cloudflared any main
d-i apt-setup/local3/key string https://pkg.cloudflare.com/cloudflare-main.gpg
d-i apt-setup/local3/comment string cloudflared-upstream
d-i apt-setup/local3/source boolean false

# llvm-suite-toolchain-21
d-i apt-setup/local4/repository string https://apt.llvm.org/unstable/ llvm-toolchain-21 main
d-i apt-setup/local4/key string https://apt.llvm.org/llvm-snapshot.gpg.key
d-i apt-setup/local4/comment string llvm-suite-toolchain-21
d-i apt-setup/local4/source boolean false

# llvm-suite-toolchain-22
d-i apt-setup/local5/repository string https://apt.llvm.org/unstable/ llvm-toolchain-22 main
