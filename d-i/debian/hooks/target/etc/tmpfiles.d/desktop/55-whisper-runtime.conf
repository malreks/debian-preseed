# Managed by unattended-installer for the selected medium/full desktop classes.
#
# The runtime configuration selects root-managed executables and model data.
# Reassert its metadata at boot before the desktop user services can read it.
d __INSTALLER_PATH_DIR_ETC__/whisper 0755 root root -
z __INSTALLER_PATH_DIR_ETC__/whisper/whisper.conf 0644 root root -
