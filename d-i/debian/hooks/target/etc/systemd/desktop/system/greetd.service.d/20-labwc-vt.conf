[Unit]
Conflicts=getty@tty1.service
# Load the managed greeter and compositor attachments before greetd starts
# either wrapper. Their named execution transitions have no fallback domain.
Requires=apparmor.service
# Start the reserved emergency console explicitly, including when the greeter
# or desktop fails before logind's automatic VT activation can provide it.
Wants=systemd-user-sessions.service systemd-logind.service seatd.service dbus.socket getty@tty6.service
After=apparmor.service systemd-user-sessions.service systemd-logind.service seatd.service dbus.socket getty@tty6.service

[Service]
TTYPath=__INSTALLER_PATH_DIR_DEV__/tty1
StandardInput=tty
SyslogIdentifier=greetd-labwc
StandardOutput=journal
StandardError=journal
