# Managed by unattended-installer.
#
# Keep the root APT job isolated from the desktop session bus. The helper writes
# bounded root-owned events which the Labwc user service relays to Mako.

[Service]
ExecCondition=__INSTALLER_PATH_DIR_USR_LOCAL_LIBEXEC__/network-online-check
ExecStartPre=-__INSTALLER_PATH_DIR_USR_LOCAL_LIBEXEC__/unattended-upgrades-notify started
ExecStopPost=-__INSTALLER_PATH_DIR_USR_LOCAL_LIBEXEC__/unattended-upgrades-notify finished
