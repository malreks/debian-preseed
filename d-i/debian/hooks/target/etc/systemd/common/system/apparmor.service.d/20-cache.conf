[Unit]
# __INSTALLER_PATH_DIR_VAR__/cache is tmpfs-backed on managed installs. Ensure tmpfiles has
# recreated the parser cache before the early AppArmor load begins.
After=systemd-tmpfiles-setup.service

[Service]
ExecStartPre=__INSTALLER_PATH_DIR_USR__/bin/install -d -o root -g root -m 0755 __INSTALLER_PATH_DIR_VAR_CACHE__/apparmor
