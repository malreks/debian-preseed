[Service]
# The native starter restarts per-mount instances through systemctl. Refresh
# staged/template metadata first, before its initial scan can request a start.
ExecStartPre=__INSTALLER_PATH_DIR_USR__/bin/timeout --signal=TERM --kill-after=2s 15s __INSTALLER_PATH_DIR_USR__/bin/systemctl --no-ask-password daemon-reload
