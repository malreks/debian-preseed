# Client-only configuration: never use the service account's storage.conf.
[engine]
remote = true
active_service = "devops"
compose_providers = ["__INSTALLER_PATH_DIR_USR_LOCAL_BIN__/docker-compose"]
compose_warning_logs = false
[engine.service_destinations.devops]
uri = "unix://__INSTALLER_PATH_DIR_RUN__/podman-devops/podman.sock"
