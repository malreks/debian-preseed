# Managed policy for isolated builds of the selected native suite.
$chroot_mode = 'unshare';
$distribution = '__INSTALLER_GITBUILD_DISTRIBUTION__';
$enable_network = 0;
$purge_build_directory = 'always';
$unshare_tmpdir_template = '__INSTALLER_PATH_DIR_POOL_TMP__/gitbuild-sbuild.XXXXXXXXXX';
$unshare_mmdebstrap_auto_create = 0;
$unshare_mmdebstrap_max_age = -1;
$unshare_bind_mounts = [];
$run_lintian = 1;
$run_autopkgtest = 0;
$run_piuparts = 0;
1;
